name: Build
on:
    pull_request:
        types: [opened, synchronize, reopened]

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v3
            - uses: pnpm/action-setup@v2
              with:
                  version: 11.x
            - uses: actions/setup-node@v3
              with:
                  node-version: "24"
                  cache: "pnpm"
            - run: pnpm install
            - run: pnpm run lint && pnpm run build
            - run: pnpm test
